<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="description" content="매일 수집한 구체적인 AI 활용사례 개인 피드">
  <title>AI 활용사례 피드</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #090b11;
      --panel: #11141d;
      --panel-2: #171b27;
      --line: #272c3b;
      --text: #f4f5f8;
      --muted: #9aa3b7;
      --accent: #9b8cff;
      --accent-2: #62d6ae;
      --warn: #ffbd66;
      --shadow: 0 18px 50px rgba(0,0,0,.28);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background:
        radial-gradient(circle at 50% -12rem, rgba(115,92,255,.18), transparent 28rem),
        var(--bg);
      color: var(--text);
      font-family: Pretendard, "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
      line-height: 1.62;
      word-break: keep-all;
    }
    button, select, input { font: inherit; }
    button, select, label { min-height: 44px; }
    button, select {
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--text);
      background: var(--panel-2);
    }
    button { cursor: pointer; }
    button:focus-visible, select:focus-visible, a:focus-visible, input:focus-visible {
      outline: 3px solid rgba(155,140,255,.42);
      outline-offset: 2px;
    }
    .app { width: min(640px, 100%); margin: 0 auto; padding: 0 16px 80px; }
    header { padding: 48px 4px 26px; }
    .eyebrow {
      color: var(--accent-2);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    h1 {
      margin: 10px 0 8px;
      font-size: clamp(31px, 8vw, 46px);
      line-height: 1.12;
      letter-spacing: -.045em;
    }
    header p { margin: 0; color: var(--muted); }
    .filter-shell {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px 20px;
      padding: 10px 16px 12px;
      border-bottom: 1px solid rgba(39,44,59,.84);
      background: rgba(9,11,17,.92);
      backdrop-filter: blur(16px);
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    select { width: 100%; padding: 0 12px; }
    .toggles {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-top: 8px;
    }
    .toggle {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 11px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
      cursor: pointer;
      user-select: none;
    }
    .toggle:has(input:checked) {
      border-color: rgba(155,140,255,.72);
      background: rgba(155,140,255,.13);
      color: #ddd8ff;
    }
    .toggle input { margin: 0; accent-color: var(--accent); }
    .status {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 13px 2px 0;
      color: var(--muted);
      font-size: 12px;
    }
    .feed { display: grid; gap: 14px; }
    .card {
      position: relative;
      overflow: hidden;
      padding: 21px 19px 17px;
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(145deg, rgba(24,28,40,.98), rgba(15,18,26,.98));
      box-shadow: var(--shadow);
      transition: opacity .18s ease, border-color .18s ease, transform .18s ease;
    }
    .card:hover { border-color: #3a4053; transform: translateY(-1px); }
    .card.is-read { opacity: .52; box-shadow: none; }
    .card-head { display: grid; grid-template-columns: 1fr 44px; gap: 10px; align-items: start; }
    h2 { margin: 0; font-size: 20px; line-height: 1.36; letter-spacing: -.02em; }
    .star {
      width: 44px;
      height: 44px;
      padding: 0;
      color: #798197;
      font-size: 23px;
    }
    .star.is-on { color: #ffd36d; border-color: rgba(255,211,109,.42); }
    .summary { margin: 13px 0 15px; color: #c9cede; font-size: 14px; }
    .badges { display: flex; flex-wrap: wrap; gap: 6px; }
    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 27px;
      padding: 3px 8px;
      border-radius: 999px;
      background: #222738;
      color: #bdc4d5;
      font-size: 11px;
      font-weight: 800;
    }
    .badge.tool { color: #d8d2ff; background: rgba(155,140,255,.16); }
    .badge.action { color: #a7f0d4; background: rgba(98,214,174,.13); }
    .badge.hard { color: #ffd8a4; background: rgba(255,189,102,.12); }
    .card-foot {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 17px;
      padding-top: 13px;
      border-top: 1px solid rgba(39,44,59,.78);
    }
    .meta { margin-right: auto; color: #7f899e; font-size: 11px; }
    .read-button {
      min-width: 72px;
      padding: 0 12px;
      color: #b9c1d2;
      font-size: 12px;
      font-weight: 800;
    }
    .source {
      display: inline-grid;
      place-items: center;
      min-height: 44px;
      padding: 0 12px;
      border: 1px solid rgba(155,140,255,.35);
      border-radius: 12px;
      color: #d8d2ff;
      text-decoration: none;
      font-size: 12px;
      font-weight: 900;
      background: rgba(155,140,255,.08);
    }
    .empty {
      padding: 58px 24px;
      border: 1px dashed #343a4d;
      border-radius: 18px;
      color: var(--muted);
      text-align: center;
    }
    .selftest {
      display: none;
      margin-bottom: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #12281f;
      color: #a7f0d4;
      font: 12px/1.4 ui-monospace, Consolas, monospace;
    }
    body[data-selftest] .selftest { display: block; }
    @media (max-width: 430px) {
      .app { padding-inline: 12px; }
      .filter-shell { margin-inline: -12px; padding-inline: 12px; }
      header { padding-top: 34px; }
      .card { padding: 18px 15px 14px; }
      .card-foot { flex-wrap: wrap; }
      .meta { flex-basis: 100%; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { scroll-behavior: auto !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header>
      <div class="eyebrow">Daily AI field notes</div>
      <h1>AI 활용사례 피드</h1>
      <p>뉴스가 아니라, 실제로 무엇을 만들고 자동화했는지만 모았습니다.</p>
    </header>

    <section class="filter-shell" aria-label="피드 필터">
      <div class="filter-row">
        <select id="toolFilter" aria-label="도구별 필터"><option value="">모든 도구</option></select>
        <select id="domainFilter" aria-label="도메인별 필터"><option value="">모든 도메인</option></select>
      </div>
      <div class="toggles">
        <label class="toggle"><input id="actionableOnly" type="checkbox"> 따라하기 쉬운 사례</label>
        <label class="toggle"><input id="bookmarkedOnly" type="checkbox"> ★ 북마크만</label>
      </div>
      <div class="status"><span id="countStatus">0건</span><span>최신순 · 로컬 저장</span></div>
    </section>

    <div id="selftest" class="selftest" role="status"></div>
    <section id="feed" class="feed" aria-live="polite"></section>
  </main>

  <script id="caseData" type="application/json">[{"id":"2026-07-25-029","title":"AI 에이전트 행동 기록용 로컬 감사 도구 Lotor 개발","summary":"개발자가 AI 에이전트 세션의 행동을 로컬에 서명된 형태로 기록하는 MCP 기반 도구 Lotor를 GitHub에 공개했다. 이 도구는 에이전트가 수행한 작업, 파일 접근, 비용 등을 위변조 감지가 가능한 로그로 남기며 클라우드 업로드 없이 사용자 기기에만 저장된다.","tool":["MCP"],"domain":"개발","difficulty":"어려움","actionable":false,"source_url":"https://github.com/githubscum/lotor","source_name":"Hacker News Show HN","collected_at":"2026-07-25"},{"id":"2026-07-25-028","title":"맥용 로컬 AI 모델 실행 앱 Nativ 개발","summary":"개발자 Prince Canuma가 MLX 기반 로컬 LLM 실행 앱 Nativ를 개발했다. 이 앱은 LM Studio와 유사하게 채팅 인터페이스와 로컬 API 서버를 제공하며 Hugging Face 캐시에 있던 모델도 자동으로 인식했다.","tool":["MLX","MLX-VLM"],"domain":"개발","difficulty":"중간","actionable":true,"source_url":"https://simonwillison.net/2026/Jul/21/nativ","source_name":"Simon Willison","collected_at":"2026-07-25"},{"id":"2026-07-25-017","title":"Git worktree 기반 계층형 AI 코딩 에이전트 트리 도구","summary":"plasma-ai가 Claude Code, Codex, Grok Build, OpenCode, Oh My Pi 등 5개 에이전트 백엔드를 지원하는 오픈소스 CLI 도구 'Fractal'을 공개했다. 각 노드가 자체 git worktree에서 목표를 향해 반복 작업하며 분리 가능한 하위 작업을 위해 자식 노드를 재귀적으로 생성하는 트리 구조로 동작한다. 실행 이력과 비용은 로컬 SQLite DB에 기록되며 터미널 UI로 실시간 확인 및 조작이 가능하다.","tool":["Claude Code","Codex","Grok Build","OpenCode","Oh My Pi"],"domain":"개발","difficulty":"어려움","actionable":true,"source_url":"https://github.com/plasma-ai/fractal","source_name":"Hacker News Show HN","collected_at":"2026-07-25"},{"id":"2026-07-25-016","title":"AI 모델별 펠리컨-자전거 그림 벤치마크 실험","summary":"Dylan Castillo가 GPT-5.6 Terra, Claude Sonnet 5, Gemini 3.5 Flash 등 7개 모델에 8종 동물×6종 탈것 조합으로 48개 프롬프트를 각 3회씩 실행해 그림 품질을 비교했다. GPT-5.6 Luna와 Gemini 3.1 Flash-Lite를 평가자로 활용해 결과를 채점하고 필터링 가능한 결과 뷰를 제공했다. 분석 결과 특정 AI 랩이 '펠리컨 자전거' 조합을 의도적으로 더 잘 그리도록 학습시켰다는 증거는 발견되지 않았다.","tool":["GPT-5.6 Terra","Claude Sonnet 5","Gemini 3.5 Flash","Grok 4.5","Qwen3.7-Max","GLM-5.2","DeepSeek V4 Pro"],"domain":"리서치","difficulty":"중간","actionable":false,"source_url":"https://simonwillison.net/2026/Jul/22/are-ai-labs-pelicanmaxxing","source_name":"Simon Willison","collected_at":"2026-07-25"},{"id":"2026-07-25-014","title":"Whisper API로 만든 BYOK 음성입력 안드로이드 키보드","summary":"개발자가 OpenAI의 음성 인식(Whisper) API를 자신의 API 키로 직접 호출하는 안드로이드 커스텀 키보드(IME) 'KoIME'를 오픈소스로 공개했다. 마이크 버튼을 눌러 녹음하면 음성이 OpenAI로 전송되어 전사된 텍스트가 입력창에 삽입되며, 서버 중개 없이 사용자 자신의 키와 기기만으로 동작한다. 문서에는 AI를 활용해 코드를 읽고 포크·수정하는 것을 권장하는 설명이 포함되어 있다.","tool":["OpenAI Whisper API","Android Studio/Gradle"],"domain":"개발","difficulty":"중간","actionable":true,"source_url":"https://github.com/sakai-sktech/koime","source_name":"Hacker News Show HN","collected_at":"2026-07-25"},{"id":"2026-07-25-003","title":"Claude Opus 5로 2D 자동차 시뮬레이터를 3D로 원샷 변환","summary":"한 사용자가 도로를 따라 이동하며 연료가 필요한 2D 자동차 시뮬레이터를 3D 버전으로 바꾸는 단일 프롬프트 작업을 Claude Opus 5와 Fable 5 모델에 각각 수행시켜 비교했다. Opus 5는 별도의 세부 지시 없이 창의적 자유도를 준 프롬프트만으로 고층 빌딩, 조명, 차량, 지도가 포함된 완성도 높은 3D 결과물을 한 번에 생성했다. 작성자는 Opus 5의 결과물에 강한 인상을 받았다고 밝혔다.","tool":["Claude Opus 5","Fable 5"],"domain":"개발","difficulty":"중간","actionable":true,"source_url":"https://www.reddit.com/r/ClaudeAI/comments/1v5p34g/my_results_opus_5_vs_fable_5","source_name":"r/ClaudeAI","collected_at":"2026-07-25"},{"id":"2026-07-24-028","title":"USB로 실행되는 오프라인 자율 AI 에이전트 제작","summary":"개발자가 기존 USB-Uncensored-LLM 프로젝트를 확장해 13개 도구와 5개 GGUF 모델을 탑재한 완전 자율 AI 에이전트를 만들었다. 설치 없이 USB에서 바로 실행되며 Windows, Linux, Tails에서 동작하고 설정 후에는 완전히 오프라인으로 작동한다.","tool":["GGUF 모델","로컬 LLM"],"domain":"개발","difficulty":"어려움","actionable":true,"source_url":"https://github.com/pusucip25/USB-AI-Agent","source_name":"Hacker News Show HN","collected_at":"2026-07-24"},{"id":"2026-07-24-024","title":"CV·TTS로 인쇄물 단어 자동 추출해 Anki 카드 생성","summary":"프랑스어·독일어 학습을 위해 ETL 스타일 프레임워크 'Hanky'를 만들어 인쇄물에서 강조된 단어를 컴퓨터 비전으로 추출했다. 추출한 단어를 번역 API로 번역하고 TTS 서비스로 음성을 생성한 뒤 Anki 플래시카드로 자동 적재하는 파이프라인을 구축했다. 수년간 개인 학습에 사용해온 도구를 오픈소스로 공개했다.","tool":["CV(컴퓨터 비전)","TTS 서비스","번역 API"],"domain":"업무자동화","difficulty":"중간","actionable":true,"source_url":"https://github.com/Haeata-Ash/hanky","source_name":"Hacker News Show HN","collected_at":"2026-07-24"},{"id":"2026-07-24-022","title":"바이브코딩 리더보드 '오픈코드워' 클로드 코드로 제작","summary":"개발자가 혼자 사용하던 바이브코딩 습관을 공유하기 위해 프롬프트 수와 글자 수를 집계하는 리더보드 '오픈코드워'를 만들었다. 클로드 코드 플러그인 마켓플레이스를 통해 설치할 수 있도록 배포했다. 코드 자체는 AI가 작성하는 것을 전제로, AI 사용량을 기록·비교하는 도구로 공개했다.","tool":["Claude Code"],"domain":"개발","difficulty":"쉬움","actionable":true,"source_url":"https://news.hada.io/topic?id=31733","source_name":"GeekNews","collected_at":"2026-07-24"},{"id":"2026-07-24-020","title":"100개 AI 모델에 동일 질문해 답변 편향 비교","summary":"ModelBias.ai 프로젝트는 Claude, GPT, Gemini, DeepSeek 등 100개 AI 모델에 동일한 100개 질문을 각각 3회씩 물어 총 3만 개 응답을 수집했다. 공공·민영 의료 선호 등 정치·사회적 질문에 대한 모델별 응답 분포를 비교해 웹사이트에 공개했다. 결과는 제공사별 가중치를 적용해 탐색할 수 있다.","tool":["Claude","GPT-5","Gemini","DeepSeek","Grok"],"domain":"리서치","difficulty":"중간","actionable":false,"source_url":"https://www.modelbias.ai/prompt/public-or-private-healthcare","source_name":"Hacker News Show HN","collected_at":"2026-07-24"},{"id":"2026-07-24-018","title":"논문을 자동 영상 강의로 바꾸는 ArXivMax 개발","summary":"개발자가 arXiv 논문을 자동으로 3Blue1Brown 스타일 설명 영상으로 만들어주는 서비스 ArXivMax를 만들었다. 영상 제작에는 오픈소스 Manim 엔진을 사용했고, 콘텐츠 생성 작업에 OpenAI Codex의 구독형 토큰 플랜을 활용했다고 밝혔다. DDPM 논문 등 예시 영상이 공개되어 있으며 현재 무료로 서비스되고 있다.","tool":["Codex","Manim"],"domain":"콘텐츠","difficulty":"어려움","actionable":false,"source_url":"https://www.arxivmax.com","source_name":"Hacker News Show HN","collected_at":"2026-07-24"},{"id":"2026-07-24-015","title":"음성 명령으로 PC를 조작하는 오픈소스 AI 에이전트","summary":"PersonalJarvis는 음성 명령을 인식해 Claude Code, Codex CLI, MCP, 컴퓨터 사용 에이전트로 작업을 위임하는 오픈소스 음성 비서 겸 메타 오케스트레이터다. 리서치 요청 시 에이전트가 독립 실행되어 보고서 파일을 만들고, Twilio 연동으로 실제 전화 예약을 대행하며 브라우저 조작도 화면에서 직접 수행한다. Gemini, Claude, OpenAI, OpenRouter 등 여러 AI 제공자를 설정에서 전환할 수 있고 지식 위키로 세션 간 기억을 유지한다.","tool":["Claude Code","Codex CLI","MCP","Gemini","OpenAI","OpenRouter","Twilio"],"domain":"업무자동화","difficulty":"어려움","actionable":true,"source_url":"https://github.com/PersonalJarvis/PersonalJarvis","source_name":"Hacker News Show HN","collect         });
      };
      appendOptions(toolFilter, CASES.flatMap(card => card.tool));
      appendOptions(domainFilter, CASES.map(card => card.domain));

      const makeBadge = (text, className = "") => {
        const badge = document.createElement("span");
        badge.className = `badge ${className}`.trim();
        badge.textContent = text;
        return badge;
      };

      const toggleBookmark = id => {
        bookmarks.has(id) ? bookmarks.delete(id) : bookmarks.add(id);
        safeSaveSet(KEYS.bookmarks, bookmarks);
        render();
      };
      const toggleRead = id => {
        read.has(id) ? read.delete(id) : read.add(id);
        safeSaveSet(KEYS.read, read);
        render();
      };

      const makeCard = card => {
        const article = document.createElement("article");
        article.className = "card" + (read.has(card.id) ? " is-read" : "");
        article.dataset.id = card.id;

        const head = document.createElement("div");
        head.className = "card-head";
        const title = document.createElement("h2");
        title.textContent = card.title;
        const star = document.createElement("button");
        star.type = "button";
        star.className = "star" + (bookmarks.has(card.id) ? " is-on" : "");
        star.setAttribute("aria-label", bookmarks.has(card.id) ? "북마크 해제" : "북마크");
        star.setAttribute("aria-pressed", String(bookmarks.has(card.id)));
        star.textContent = bookmarks.has(card.id) ? "★" : "☆";
        star.addEventListener("click", () => toggleBookmark(card.id));
        head.append(title, star);

        const summary = document.createElement("p");
        summary.className = "summary";
        summary.textContent = card.summary;

        const badges = document.createElement("div");
        badges.className = "badges";
        card.tool.forEach(tool => badges.append(makeBadge(tool, "tool")));
        badges.append(makeBadge(card.domain));
        badges.append(makeBadge(card.difficulty, card.difficulty === "어려움" ? "hard" : ""));
        if (card.actionable) badges.append(makeBadge("따라하기 가능", "action"));

        const foot = document.createElement("div");
        foot.className = "card-foot";
        const meta = document.createElement("span");
        meta.className = "meta";
        meta.textContent = `${card.source_name} · ${card.collected_at}`;
        const readButton = document.createElement("button");
        readButton.type = "button";
        readButton.className = "read-button";
        readButton.textContent = read.has(card.id) ? "읽음 취소" : "읽음";
        readButton.setAttribute("aria-pressed", String(read.has(card.id)));
        readButton.addEventListener("click", () => toggleRead(card.id));
        const source = document.createElement("a");
        source.className = "source";
        source.href = card.source_url;
        source.target = "_blank";
        source.rel = "noopener noreferrer";
        source.textContent = "원문 보기 ↗";
        source.addEventListener("click", () => {
          if (!read.has(card.id)) {
            read.add(card.id);
            safeSaveSet(KEYS.read, read);
          }
        });
        foot.append(meta, readButton, source);
        article.append(head, summary, badges, foot);
        return article;
      };

      const filteredCases = () => CASES.filter(card =>
        (!toolFilter.value || card.tool.includes(toolFilter.value)) &&
        (!domainFilter.value || card.domain === domainFilter.value) &&
        (!actionableOnly.checked || card.actionable) &&
        (!bookmarkedOnly.checked || bookmarks.has(card.id))
      );

      function render() {
        const visible = filteredCases();
        feed.replaceChildren();
        if (!visible.length) {
          const empty = document.createElement("div");
          empty.className = "empty";
          empty.textContent = "조건에 맞는 사례가 없습니다.";
          feed.append(empty);
        } else {
          const fragment = document.createDocumentFragment();
          visible.forEach(card => fragment.append(makeCard(card)));
          feed.append(fragment);
        }
        countStatus.textContent = `${visible.length}건 / 전체 ${CASES.length}건`;
      }

      [toolFilter, domainFilter, actionableOnly, bookmarkedOnly]
        .forEach(control => control.addEventListener("change", render));

      const runSelfTest = () => {
        const mode = new URLSearchParams(location.search).get("selftest");
        if (!mode) return;
        const status = byId("selftest");
        try {
          if (!CASES.length) throw new Error("테스트할 카드가 없음");
          const id = CASES[0].id;
          if (mode === "write") {
            bookmarks.add(id);
            read.add(id);
            if (!safeSaveSet(KEYS.bookmarks, bookmarks) || !safeSaveSet(KEYS.read, read)) {
              throw new Error("localStorage 저장 실패");
            }
            render();
          }
          toolFilter.value = CASES[0].tool[0];
          domainFilter.value = CASES[0].domain;
          actionableOnly.checked = CASES[0].actionable;
          bookmarkedOnly.checked = true;
          render();
          const filtered = filteredCases();
          const filtersPassed =
            filtered.length > 0 &&
            filtered.every(card =>
              card.tool.includes(toolFilter.value) &&
              card.domain === domainFilter.value &&
              (!actionableOnly.checked || card.actionable) &&
              bookmarks.has(card.id)
            );
          toolFilter.value = "";
          domainFilter.value = "";
          actionableOnly.checked = false;
          bookmarkedOnly.checked = false;
          render();
          const card = feed.querySelector(`[data-id="${CSS.escape(id)}"]`);
          const touchTargets = [
            toolFilter,
            domainFilter,
            actionableOnly.closest("label"),
            bookmarkedOnly.closest("label"),
            card && card.querySelector(".star"),
            card && card.querySelector(".read-button"),
            card && card.querySelector(".source")
          ].filter(Boolean);
          const passed =
            filtersPassed &&
            bookmarks.has(id) &&
            read.has(id) &&
            !!card &&
            card.classList.contains("is-read") &&
            card.querySelector(".star").getAttribute("aria-pressed") === "true" &&
            touchTargets.every(target => target.getBoundingClientRect().height >= 44) &&
            toolFilter.options.length > 1 &&
            domainFilter.options.length > 1;
          if (!passed) throw new Error("상태 또는 필터 검증 실패");
          document.body.dataset.selftest = "PASS";
          status.textContent = `PASS:${mode}:cards=${CASES.length}`;
        } catch (error) {
          document.body.dataset.selftest = "FAIL";
          status.textContent = `FAIL:${mode}:${error.message}`;
        }
      };

      window.__feedTestApi = {
        render,
        filteredCases,
        toggleBookmark,
        toggleRead,
        bookmarks,
        read
      };
      render();
      runSelfTest();
    })();
  </script>
</body>
</html>
