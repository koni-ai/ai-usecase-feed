<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">노식의 신중함은 왜 벌을 받았나 전황판</title><desc id="desc">현장 성과보다 보고 길목을 쥔 사람이 상사의 판단을 바꿨다.</desc>
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17211d"/><stop offset="1" stop-color="#29372f"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="760" rx="48" fill="url(#bg)"/><path d="M70 112H1130M70 638H1130" stroke="#d9c8a1" stroke-opacity=".22"/>
  <text x="70" y="76" fill="#d9c8a1" font-family="sans-serif" font-size="26" font-weight="700">DAY 011 · 184년 여름 · 사람을 움직이는 기술</text>
  <text x="70" y="160" fill="#fffaf0" font-family="serif" font-size="58" font-weight="700">노식의 신중함은 왜 벌을 받았나</text>
  <path d="M230 360H490M710 360H970" stroke="#a84a3f" stroke-width="12" stroke-linecap="round"/><path d="M465 335l35 25-35 25M945 335l35 25-35 25" fill="none" stroke="#a84a3f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <g filter="url(#shadow)"><circle cx="160" cy="360" r="110" fill="#f2ead8"/><text x="160" y="350" text-anchor="middle" fill="#17211d" font-family="sans-serif" font-size="31" font-weight="800">노식의 관군</text><text x="160" y="392" text-anchor="middle" fill="#4b564f" font-family="sans-serif" font-size="22">광종</text></g><g filter="url(#shadow)"><circle cx="600" cy="360" r="110" fill="#a84a3f"/><text x="600" y="350" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="31" font-weight="800">장각군</text><text x="600" y="392" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22">낙양</text></g><g filter="url(#shadow)"><circle cx="1040" cy="360" r="110" fill="#f2ead8"/><text x="1040" y="350" text-anchor="middle" fill="#17211d" font-family="sans-serif" font-size="31" font-weight="800">환관 좌풍</text><text x="1040" y="392" text-anchor="middle" fill="#4b564f" font-family="sans-serif" font-size="22">광종</text></g>
  <rect x="70" y="535" width="1060" height="78" rx="22" fill="#fffaf0" fill-opacity=".1"/><text x="100" y="584" fill="#fffaf0" font-family="sans-serif" font-size="28">현장 성과보다 보고 길목을 쥔 사람이 상사의 판단을 바꿨다.</text>
  <text x="70" y="692" fill="#d9c8a1" font-family="sans-serif" font-size="21">역사적 공간을 이해하기 위한 편집 도식 · 실제 지도 축척이 아닙니다</text>
</svg>