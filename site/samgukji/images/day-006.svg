  <g filter="url(#shadow)"><circle cx="160" cy="360" r="110" fill="#f2ead8"/><text x="160" y="350" text-anchor="middle" fill="#17211d" font-family="sans-serif" font-size="31" font-weight="800">장각 지도부</text><text x="160" y="392" text-anchor="middle" fill="#4b564f" font-family="sans-serif" font-size="22">거록</text></g><g filter="url(#shadow)"><circle cx="600" cy="360" r="110" fill="#c68a2f"/><text x="600" y="350" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="31" font-weight="800">방 책임자</text><text x="600" y="392" text-anchor="middle" fill="#fff" font-family="sans-serif" font-size="22">36개 방</text></g><g filter="url(#shadow)"><circle cx="1040" cy="360" r="110" fill="#f2ead8"/><text x="1040" y="350" text-anchor="middle" fill="#17211d" font-family="sans-serif" font-size="31" font-weight="800">신도</text><text x="1040" y="392" text-anchor="middle" fill="#4b564f" font-family="sans-serif" font-size="22">거록</text></g>
