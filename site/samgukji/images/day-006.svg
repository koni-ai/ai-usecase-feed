  <rect width="1200" height="760" rx="48" fill="url(#bg)"/><path d="M70 112H1130M70 638H1130" stroke="#d9c8a1" stroke-opacity=".22"/>
  <text x="70" y="76" fill="#d9c8a1" font-family="sans-serif" font-size="26" font-weight="700">DAY 006 · 184년 직전 · 장사의 눈</text>
  <text x="70" y="160" fill="#fffaf0" font-family="serif" font-size="58" font-weight="700">36개 거점의 힘과 약점</text>
