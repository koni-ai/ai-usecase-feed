name: Weekly AI source discovery

on:
  workflow_dispatch:
  schedule:
    - cron: "15 8 * * 0"
      timezone: "Asia/Seoul"

permissions:
  contents: write

concurrency:
  group: ai-usecase-feed-production
  cancel-in-progress: false

jobs:
  discover-and-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Run deterministic tests
        run: python -B -m unittest discover -s tests -q

      - name: Discover, probe, and score sources
        run: python -B source_manager.py discover

      - name: Validate source state
        run: |
          python -c 'import json,pathlib; r=json.loads(pathlib.Path("data/source_registry.json").read_text(encoding="utf-8")); h=json.loads(pathlib.Path("data/source_health.json").read_text(encoding="utf-8")); assert r["schema_version"] == 1 and isinstance(r["sources"], list); assert h["schema_version"] == 1 and isinstance(h["sources"], dict)'

      - name: Persist successful source state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source_registry.json data/source_health.json
          if git diff --cached --quiet; then
            echo "No source state changes to commit."
          else
            git commit -m "chore: update AI source registry"
            git push origin HEAD:main
          fi
