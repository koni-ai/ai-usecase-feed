name: Daily Habitus docent

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ai-usecase-feed-production
  cancel-in-progress: false

jobs:
  publish-habitus:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Claude Code subscription client
        run: npm install --global @anthropic-ai/claude-code@2.1.218

      - name: Reject metered API routing
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLAUDE_CODE_OAUTH_TOKEN:-}"
          test -z "${ANTHROPIC_API_KEY:-}"
          case "${CLAUDE_CODE_OAUTH_TOKEN}" in sk-ant-oat01-*) ;; *) exit 1 ;; esac

      - name: Validate current Habitus feed
        run: python -B habitus/generate_daily.py --validate-only

      - name: Generate today's docent story
        run: python -B habitus/generate_daily.py

      - name: Validate publish artifact
        run: |
          python -B habitus/generate_daily.py --validate-only
          python -c 'import json,pathlib; p=pathlib.Path("site/habitus/feed.json"); d=json.loads(p.read_text(encoding="utf-8")); assert p.stat().st_size > 10000 and len(d["items"]) >= 7'

      - name: Persist successful state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add habitus/data/feed.json site/habitus/feed.json
          if git diff --cached --quiet; then
            echo "Habitus already published for today."
          else
            git commit -m "chore: publish daily Habitus docent"
            git push origin HEAD:main
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages content endpoint
        id: deployment
        uses: actions/deploy-pages@v4

